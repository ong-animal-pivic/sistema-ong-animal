spring.application.name=sistema-ong-animal

spring.profiles.active=local

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.flyway.locations=classpath:db/migration,classpath:db/testdata

spring.mvc.problemdetails.enabled=true

spring.jpa.open-in-view=false

spring.messages.encoding=UTF-8
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%-5level){highlight} %clr([%15.15t]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Timezone e serializacao de data/hora -- ver secao "Data e hora" no CLAUDE.md.
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC